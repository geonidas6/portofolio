services:
  # --- PORTFOLIO PATRICE AKOTSE WEB INTERFACE ---
  portfolio_patrice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio_patrice
    env_file: .env
    environment:
      - DOMAIN=${DOMAIN:-patriceakotse.com}
    # No need for separate volumes unless we want to persist something
    # volumes:
    #   - .:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio_patrice.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.portfolio_patrice.entrypoints=websecure"
      - "traefik.http.routers.portfolio_patrice.tls.certresolver=myresolver"
      - "traefik.http.services.portfolio_patrice.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy_net"
    restart: unless-stopped
    networks:
      - proxy_net

# --- DÉFINITION DU RÉSEAU ---
networks:
  proxy_net:
    external: true
